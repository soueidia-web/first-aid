<!doctype html>
<html lang="fr" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Premiers secours RIM-HSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single centred column, one step on screen at a time, safety-sign green as the only accent */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --fg:#14211b; --muted:#56665e; --line:#d5dfd9;
  --accent:#00877b; --accent-fg:#ffffff; --accent-soft:#dff3f0; --plate:#ffffff;
  --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fff3d6;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1613; --surface:#17211c; --fg:#e6efe9; --muted:#9fb1a7; --line:#2b3a32;
  --accent:#3cc9b8; --accent-fg:#04201c; --accent-soft:#123430;
  --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f2c35b; --warn-soft:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1613; --surface:#17211c; --fg:#e6efe9; --muted:#9fb1a7; --line:#2b3a32;
  --accent:#3cc9b8; --accent-fg:#04201c; --accent-soft:#123430;
  --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f2c35b; --warn-soft:#33290f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
img.emblem{width:44px;height:44px;flex:none;display:block}
.logo-card{background:var(--plate);border:1px solid var(--line);border-radius:10px;padding-block:22px;padding-inline:16px;display:flex;justify-content:center}
.logo-card img{width:100%;max-width:260px;height:auto;display:block}
header.brand{display:flex;align-items:center;gap:12px}
.sign{width:44px;height:44px;flex:none;background:var(--accent);border-radius:6px;position:relative}
.sign::before,.sign::after{content:"";position:absolute;background:var(--accent-fg);left:50%;top:50%;transform:translate(-50%,-50%)}
.sign::before{width:26px;height:8px}.sign::after{width:8px;height:26px}
.brand h1{font:800 1.25rem/1.15 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px}
h2{font:800 1.5rem/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 1.05rem/1.3 var(--display);margin:0}
p{margin:0}
.eyebrow{font:600 .75rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
ul.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.key{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-weight:600}
.caution{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:12px 14px}
.caution b{color:var(--warn)}
label{font-weight:600;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
input[type=text]{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between}
button{font:600 1rem var(--body);border-radius:8px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;font-weight:400;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.opt .l{font:600 .85rem var(--mono);color:var(--muted);flex:none;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{color:var(--accent)}
.score{font:800 3.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:700 .8rem var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pill.pass{background:var(--accent-soft);color:var(--accent)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.record{border:2px solid var(--accent);border-radius:10px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
.record dt{color:var(--muted);font-size:.9rem}
.record dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.code{font:500 1.35rem var(--mono);letter-spacing:.06em;color:var(--accent)}
.review{display:flex;flex-direction:column;gap:10px}
.review div{border-left:3px solid var(--bad);padding:4px 0 4px 12px}
.ok{color:var(--accent);font-weight:700}.no{color:var(--bad);font-weight:700}
footer{font-size:.85rem;color:var(--muted);text-align:center}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
:root{--ink:#26403a;--ink2:#8aa39c;--ill-bg:#e6f1ee;--blood:#c62828;--sun:#f2b705;--water:#2f86d0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#d3e4df;--ink2:#6f8a83;--ill-bg:#1a2925;--blood:#ef5350;--sun:#f5c542;--water:#6fb3f0}}
:root[data-theme="dark"]{--ink:#d3e4df;--ink2:#6f8a83;--ill-bg:#1a2925;--blood:#ef5350;--sun:#f5c542;--water:#6fb3f0}
.ill{background:var(--ill-bg);border-radius:10px;padding:8px;display:flex;justify-content:center}
.ill svg{width:100%;max-width:440px;height:auto;display:block;direction:ltr}
svg .ln{stroke:var(--ink);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;fill:none}
svg .cs{stroke:var(--ink2)} svg .thin{stroke-width:4}
svg .hd{fill:var(--ink)} svg .hd2{fill:var(--ink2)} svg .ac{fill:var(--accent)} svg .acs{stroke:var(--accent)}
svg .af{fill:var(--accent-fg)} svg .rd{fill:var(--blood)} svg .yl{fill:var(--sun)} svg .bl{fill:var(--water)}
svg .pl{fill:var(--plate);stroke:var(--line);stroke-width:2} svg .gd{stroke:var(--line);stroke-width:3}
svg .ray{stroke:var(--sun);stroke-width:5;stroke-linecap:round}
svg .st{fill:var(--ill-bg);font:700 13px var(--body)} svg .sti{fill:var(--ink);font:700 15px var(--body)}
.push{transition:none}
@keyframes press{50%{transform:translateY(8px)}}
.loop .push{animation:press .545s ease-in-out infinite}
.push.go{animation:press .22s ease-out}
.presser{transition:transform .15s}.presser.down{transform:translateY(6px)}
.stain{transform-box:fill-box;transform-origin:center}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(46px);opacity:0}}
.drop{animation:drop 1.05s linear infinite}.d2{animation-delay:.35s}.d3{animation-delay:.7s}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-origin:70px 52px;animation:spin 24s linear infinite}
@keyframes rise{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
.merc{transform-box:fill-box;transform-origin:bottom;animation:rise 2.6s ease-in-out infinite alternate}
@keyframes draw{from{stroke-dashoffset:34}to{stroke-dashoffset:0}}
.tick{stroke-dasharray:34;animation:draw .5s ease-out both}.t1{animation-delay:.4s}.t2{animation-delay:.8s}.t3{animation-delay:1.2s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.act{border:2px dashed var(--accent);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.act-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.act-state{font-size:.85rem;font-weight:700;color:var(--muted)}.act-state.ok{color:var(--accent)}
.act-msg{min-height:1.5em;font-weight:600;margin:0}.act-msg.good{color:var(--accent)}.act-msg.bad{color:var(--bad)}
.act-body{display:flex;flex-direction:column;gap:12px}
.slots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.slots li{border:1px dashed var(--line);border-radius:8px;padding:10px;min-height:48px;display:flex;gap:10px;align-items:center;font-weight:600}
.slots li span{font:600 .8rem var(--mono);color:var(--muted)}
.slots li.fill{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.gwrap{display:flex;flex-direction:column;gap:4px}
.gauge{position:relative;height:14px;border-radius:7px;background:var(--line);margin-inline:6px}
.gauge .zone{position:absolute;top:0;bottom:0;left:40%;width:20%;background:var(--accent);opacity:.45;border-radius:7px}
.gauge i{position:absolute;top:-5px;width:4px;height:24px;margin-left:-2px;background:var(--fg);border-radius:2px;left:0;transition:left .2s}
.gl{position:relative;height:1.3em;font-size:.78rem;color:var(--muted);margin-inline:6px;font-variant-numeric:tabular-nums}
.gl span{position:absolute;transform:translateX(-50%)}
.gl span:first-child{transform:none}.gl span:last-child{transform:translateX(-100%)}
button.big{font-size:1.2rem;padding:20px;width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.beat{width:14px;height:14px;border-radius:50%;background:var(--line)}
@keyframes beat{from{background:var(--accent);transform:scale(1.4)}to{background:var(--line);transform:scale(1)}}
.beat.on{animation:beat .3s ease-out}
.sortcard{border:1px solid var(--line);border-radius:8px;padding:16px;font-weight:600;font-size:1.08rem;text-align:center;background:var(--bg)}
.sortcard.sc{text-align:start;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{padding:14px 8px}
.opt.sel:disabled{opacity:1}
.lockhint{font-size:.9rem;color:var(--muted);margin:0}
.passmark{width:64px;height:64px}
.passmark path{stroke:var(--accent-fg);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;animation:draw2 .6s .2s ease-out both}
@keyframes draw2{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.loop .push,.push.go,.drop,.spin,.merc,.tick,.shake,.beat.on,.passmark path{animation:none}.presser{transition:none}}
</style>
</head><body>

{t:"Votre rôle de secouriste",b:[
 "Préserver la vie, empêcher l'aggravation de l'état de la victime et favoriser sa récupération.",
 "Restez calme, prenez la situation en main et demandez de l'aide rapidement. On ne vous demande pas de poser un diagnostic.",
 "Protégez-vous : portez des gants si possible et évitez tout contact avec le sang et les liquides biologiques.",
 "Sachez où se trouvent la trousse de secours, le défibrillateur (DAE) et le numéro d'urgence de votre site avant d'en avoir besoin."],
 k:"Objectifs des premiers secours : préserver la vie · empêcher l'aggravation · favoriser la récupération."},
{t:"Sécurité de la zone et bilan initial",b:[
 "Danger (D) : vérifiez les dangers pour vous, les témoins et la victime (circulation, machines en mouvement, électricité, feu, charges suspendues). Ne devenez jamais une deuxième victime.",
 "Réaction (R) : parlez fort et tapotez les épaules. La victime réagit-elle ?",
 "Alerter (S) : appelez à l'aide et demandez à quelqu'un d'appeler le numéro d'urgence et d'apporter le DAE.",
 "Voies aériennes (A) : basculez la tête en arrière et élevez le menton.",
 "Respiration (B) : regardez, écoutez et sentez une respiration normale pendant 10 secondes au maximum.",
 "Circulation (C) : si la victime ne respire pas normalement, commencez la RCP. Si elle respire, recherchez et arrêtez tout saignement abondant."],
 k:"DRSABC : Danger, Réaction, Alerter, voies Aériennes, Respiration, RCP/Circulation."},
{t:"La RCP et le DAE (adulte)",b:[
 "Commencez la RCP si la victime ne réagit pas et ne respire pas normalement. Des gasps (respirations irrégulières) ne sont pas une respiration normale.",
 "Placez les mains au centre de la poitrine, sur la moitié inférieure du sternum, bras tendus.",
 "Appuyez fort et vite : 5 à 6 cm de profondeur, 100 à 120 compressions par minute. Laissez la poitrine remonter complètement entre chaque compression.",
 "30 compressions puis 2 insufflations, si vous êtes formé et prêt à le faire. Sinon, faites des compressions en continu.",
 "Mettez le DAE en marche dès son arrivée et suivez ses instructions vocales. Personne ne touche la victime pendant l'analyse ou le choc.",
 "Continuez jusqu'à l'arrivée des secours, jusqu'à ce que la victime respire normalement ou jusqu'à épuisement."],
 k:"30 compressions : 2 insufflations · 5 à 6 cm de profondeur · 100 à 120 par minute.",
 c:"Réduisez les interruptions au minimum. Chaque pause dans les compressions diminue les chances de survie."},
{t:"La position latérale de sécurité (PLS)",b:[

let CLEAN=null;const DONE=new Set();
function runCleanup(){if(CLEAN){try{CLEAN()}catch(e){}CLEAN=null}}
function unlock(){const b=document.getElementById("next");if(b)b.disabled=false;const h=document.getElementById("lockhint");if(h)h.hidden=true}
function shakeEl(el){el.classList.remove("shake");void el.getBoundingClientRect();el.classList.add("shake")}
function mountActivity(i,box){
 const A=ACTS[i];if(!A||!box)return;
 box.innerHTML=`<div class="act"><div class="act-h"><span class="eyebrow">${T.activity}</span><span class="act-state ${DONE.has(i)?"ok":""}">${DONE.has(i)?T.complete:T.required}</span></div><p>${A.prompt}</p><div class="act-body"></div><p class="act-msg" aria-live="polite"></p></div>`;
 const body=box.querySelector(".act-body"),msg=box.querySelector(".act-msg"),st=box.querySelector(".act-state");
 const say=(t,c)=>{msg.textContent=t;msg.className="act-msg "+(c||"")};
 const fin=t=>{DONE.add(i);say(t,"good");st.textContent=T.complete;st.classList.add("ok");unlock()};
 ({order:actOrder,cpr:actCpr,hold:actHold,sort:actSort,scenario:actScenario})[A.type](A,body,say,fin);
}
function actOrder(A,body,say,fin){
 let pos=0;const items=shuffle(A.items.map((t,i)=>({t,i})));
 body.innerHTML=`<ol class="slots">${A.items.map((_,i)=>`<li><span>${i+1}</span><b></b></li>`).join("")}</ol><div class="tiles">${items.map(x=>`<button type="button" class="tile" data-i="${x.i}">${x.t}</button>`).join("")}</div>`;
 const slots=body.querySelectorAll(".slots li");
 body.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
  if(+b.dataset.i===pos){slots[pos].querySelector("b").textContent=b.textContent;slots[pos].classList.add("fill");b.hidden=true;pos++;
   if(pos===A.items.length)fin(A.done);else say(T.correct,"good")}
  else{shakeEl(b);say(A.wrong,"bad")}});
}
function actCpr(A,body,say,fin){
 body.innerHTML=`<div class="ill">${CPR_SVG}</div>
 <div dir="ltr" class="gwrap"><div class="gauge"><div class="zone"></div><i></i></div>
 <div class="gl"><span style="left:0">60</span><span style="left:40%">100</span><span style="left:60%">120</span><span style="left:100%">160</span></div></div>
 <div class="meta" dir="ltr"><span class="cnt">0 / 30</span><span class="rt">— /min</span></div>
 <button class="primary big" type="button" id="cprBtn">${T.press}</button>
 <div class="row"><button type="button" id="metro">${T.metroOn}</button><span class="beat" aria-hidden="true"></span></div>`;
 const push=body.querySelector(".push"),needle=body.querySelector(".gauge i"),cnt=body.querySelector(".cnt"),rt=body.querySelector(".rt"),beat=body.querySelector(".beat");
 let t=[],ended=false,ac=null,timer=null;
 const show=r=>{rt.textContent=Math.round(r)+" /min";needle.style.left=Math.max(0,Math.min(100,r-60))+"%";
  if(t.length<30)say(r<100?A.slow:r>120?A.fast:A.good,r>=100&&r<=120?"good":"bad")};
 body.querySelector("#cprBtn").onclick=()=>{
  if(ended){t=[];ended=false}
  const now=performance.now();t.push(now);
  push.classList.remove("go");push.getBoundingClientRect();push.classList.add("go");
  cnt.textContent=t.length+" / 30";
  if(t.length>1){const k=Math.min(5,t.length-1);show(60000*k/(now-t[t.length-1-k]))}
  if(t.length===30){ended=true;const avg=Math.round(60000*29/(t[29]-t[0]));rt.textContent=avg+" /min";
   if(avg>=100&&avg<=120)fin(A.done.replace("{r}",avg));else say(A.retry.replace("{r}",avg),"bad")}
 };
 const mb=body.querySelector("#metro");
 mb.onclick=()=>{
  if(timer){clearInterval(timer);timer=null;mb.textContent=T.metroOn;return}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}
  const tick=()=>{beat.classList.remove("on");beat.getBoundingClientRect();beat.classList.add("on");
   if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.09)}catch(e){}};
  tick();timer=setInterval(tick,545);mb.textContent=T.metroOff};
 CLEAN=()=>{if(timer)clearInterval(timer);if(ac)try{ac.close()}catch(e){}};
}
function actHold(A,body,say,fin){
 body.innerHTML=`<div class="ill">${BLEED_SVG}</div><div class="bar"><i style="width:0%"></i></div><button class="primary big" type="button" id="holdBtn">${A.btn}</button>`;
 const bar=body.querySelector(".bar i"),stain=body.querySelector(".stain"),btn=body.querySelector("#holdBtn"),hand=body.querySelector(".presser");
 const D=10000;let st=0,raf=0;
 const stop=ok=>{cancelAnimationFrame(raf);raf=0;hand.classList.remove("down");btn.textContent=A.btn;
  if(ok===true){bar.style.width="100%";fin(A.done)}else{bar.style.width="0%";stain.style.transform="scale(1)";say(A.released,"bad")}};
 const frame=()=>{const el=performance.now()-st,p=Math.min(1,el/D);bar.style.width=(p*100)+"%";stain.style.transform=`scale(${1-0.85*p})`;
  if(p<1){btn.textContent=A.holding.replace("{s}",Math.ceil((D-el)/1000));raf=requestAnimationFrame(frame)}else stop(true)};
 const start=e=>{e.preventDefault();if(raf)return;st=performance.now();hand.classList.add("down");say("");raf=requestAnimationFrame(frame)};
 btn.addEventListener("pointerdown",start);
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev,()=>{if(raf)stop()}));
 btn.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat)start(e)});
 btn.addEventListener("keyup",e=>{if((e.key===" "||e.key==="Enter")&&raf)stop()});
 btn.addEventListener("click",e=>e.preventDefault());
 btn.addEventListener("contextmenu",e=>e.preventDefault());
 CLEAN=()=>cancelAnimationFrame(raf);
}
function actSort(A,body,say,fin){
 let q=shuffle(A.items.map((_,i)=>i)),okc=0;const total=A.items.length;
 const draw=()=>{
  if(!q.length){body.innerHTML=`<div class="sortcard">${total} / ${total} ✓</div>`;fin(A.done);return}
  const it=A.items[q[0]];
  body.innerHTML=`<div class="meta"><span>${okc} / ${total}</span></div><div class="sortcard">${it[0]}</div><div class="two">${A.labels.map((l,j)=>`<button type="button" class="sbtn" data-j="${j}">${l}</button>`).join("")}</div>`;
  body.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{
   if(+b.dataset.j===it[1]){okc++;q.shift();say(T.correct+" "+it[0]+": "+A.labels[it[1]],"good")}
   else{q.push(q.shift());say(T.wrongThis.replace("{a}",A.labels[it[1]]),"bad")}
   draw()});
 };
 draw();
}
function actScenario(A,body,say,fin){
 let k=0;
 const draw=()=>{const s=A.items[k];
  body.innerHTML=`<div class="meta"><span>${k+1} / ${A.items.length}</span></div><div class="sortcard sc">${s.s}</div><div class="opts">${s.o.map((o,j)=>`<button type="button" class="opt" data-j="${j}"><span>${o}</span></button>`).join("")}</div>`;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   if(+b.dataset.j===s.a){b.classList.add("sel");body.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    if(k===A.items.length-1){fin(T.correct+" "+s.w)}
    else{say(T.correct+" "+s.w,"good");const nb=document.createElement("button");nb.className="primary";nb.type="button";nb.textContent=T.nextQ;nb.onclick=()=>{k++;say("");draw()};body.appendChild(nb)}}
   else{shakeEl(b);say(T.notQuite,"bad")}});
 };
 draw();
}

const S={step:"start",name:"",id:"",company:"",lesson:0,qs:[],qi:0,ans:[],result:null};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s).trim().toUpperCase().replace(/\s+/g," ")}
function hashCode(str){let h1=0x811c9dc5,h2=0x1b873593;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,2246822519)}
 const v=((h1>>>0).toString(36)+(h2>>>0).toString(36)).toUpperCase().replace(/[^A-Z0-9]/g,"").padEnd(8,"X").slice(0,8);return v.slice(0,4)+"-"+v.slice(4)}
function makeCode(name,id,score,date){return hashCode([SALT,norm(name),norm(id),score,date].join("|"))}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function render(){
 runCleanup();
 if(location.hash==="#verify"){return renderVerify()}
 ({start:renderStart,lesson:renderLesson,ready:renderReady,quiz:renderQuiz,result:renderResult})[S.step]();
 window.scrollTo(0,0);
}

function renderStart(){
 app.innerHTML=`<section class="panel">
  <div class="logo-card"><img src="${LOGO}" alt="RIM-HSE"></div>
  <span class="eyebrow">Avant de commencer</span>
  <h2>Saisissez vos informations</h2>
  <p class="muted">Votre nom et votre matricule figureront sur votre attestation de réussite. Écrivez-les comme vous souhaitez les voir sur votre certificat. La formation comprend 10 courtes leçons et une évaluation de ${QCOUNT} questions. Il faut ${Math.round(PASS*100)} % (${Math.ceil(PASS*QCOUNT)} bonnes réponses) pour réussir.</p>
  <form id="f" class="panel" style="padding:0;border:0;gap:14px">
   <label for="nm">Nom complet<input id="nm" type="text" autocomplete="name" required value="${esc(S.name)}"></label>
   <label for="eid">Matricule ou n° de pièce d'identité<input id="eid" type="text" required value="${esc(S.id)}"></label>
   <label for="co">Entreprise<input id="co" type="text" value="${esc(S.company)}"></label>
   <div class="row"><button class="primary" type="submit">Commencer la formation</button></div>
  </form></section>`;
 document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();
  S.name=document.getElementById("nm").value.trim();S.id=document.getElementById("eid").value.trim();S.company=document.getElementById("co").value.trim();
  if(!S.name||!S.id)return;S.step="lesson";S.lesson=0;render()});
}

function renderLesson(){
 const locked=!!ACTS[S.lesson]&&!DONE.has(S.lesson),L=LESSONS[S.lesson],n=LESSONS.length,pct=((S.lesson+1)/n)*100;
 app.innerHTML=`<section class="panel">
  <div class="meta"><span>Leçon ${S.lesson+1} sur ${n}</span><span>${Math.round(pct)}%</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <h2>${L.t}</h2>
  <div class="ill${S.lesson===2?" loop":""}" aria-hidden="true">${ILL[S.lesson]}</div>
  <ul class="pts">${L.b.map(x=>`<li>${x}</li>`).join("")}</ul>
  <div class="key">${L.k}</div>
  ${L.c?`<div class="caution">${L.c}</div>`:""}
  <div id="actBox"></div>
  <div class="row end"><button id="prev" ${S.lesson===0?"disabled":""}>Précédent</button>
  <button class="primary" id="next" ${locked?"disabled":""}>${S.lesson===n-1?"Passer à l'évaluation":"Leçon suivante"}</button></div>${locked?`<p class="lockhint" id="lockhint">${T.lockHint}</p>`:""}</section>`;
 document.getElementById("prev").onclick=()=>{S.lesson--;render()};
 document.getElementById("next").onclick=()=>{if(S.lesson<n-1){S.lesson++}else{S.step="ready"}render()};
 mountActivity(S.lesson,document.getElementById("actBox"));
}

function renderReady(){
 app.innerHTML=`<section class="panel">
  <span class="eyebrow">Évaluation finale</span>
  <h2>${QCOUNT} questions, seuil de réussite ${Math.ceil(PASS*QCOUNT)}/${QCOUNT}</h2>
  <ul class="pts"><li>Choisissez une réponse par question. Vous pouvez revenir en arrière et modifier vos réponses avant de valider.</li>
  <li>Les questions sont tirées au hasard : une nouvelle tentative sera différente.</li>
  <li>Si vous réussissez, vous obtiendrez une attestation avec un code de vérification. Envoyez-en une capture d'écran à votre formateur.</li></ul>
  <div class="row end"><button id="rev">Revoir les leçons</button><button class="primary" id="go">Commencer l'évaluation</button></div></section>`;
 document.getElementById("rev").onclick=()=>{S.step="lesson";S.lesson=0;render()};
 document.getElementById("go").onclick=startQuiz;
}
function startQuiz(){
 S.qs=shuffle(QUESTIONS).slice(0,QCOUNT).map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{q:q.q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}});
 S.ans=new Array(QCOUNT).fill(null);S.qi=0;S.step="quiz";render();
}

function renderQuiz(){
 const Q=S.qs[S.qi],pct=((S.qi+1)/QCOUNT)*100,last=S.qi===QCOUNT-1,done=S.ans.every(a=>a!==null);
 app.innerHTML=`<section class="panel">
  <div class="meta"><span>Question ${S.qi+1} sur ${QCOUNT}</span><span>${S.ans.filter(a=>a!==null).length} répondue(s)</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <h3 style="font-size:1.2rem">${Q.q}</h3>
  <div class="opts" role="radiogroup">${Q.o.map((o,i)=>`<button class="opt ${S.ans[S.qi]===i?"sel":""}" role="radio" aria-checked="${S.ans[S.qi]===i}" data-i="${i}"><span class="l">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}</div>
  <div class="row end"><button id="prev" ${S.qi===0?"disabled":""}>Précédent</button>
  ${last?`<button class="primary" id="sub" ${done?"":"disabled"}>Valider les réponses</button>`:`<button class="primary" id="next" ${S.ans[S.qi]===null?"disabled":""}>Suivant</button>`}</div>
  ${last&&!done?`<p class="muted">Répondez à toutes les questions pour valider. Sans réponse : ${S.ans.map((a,i)=>a===null?i+1:null).filter(Boolean).join(", ")}</p>`:""}
 </section>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[S.qi]=+b.dataset.i;render()});
 document.getElementById("prev").onclick=()=>{S.qi--;render()};
 const nx=document.getElementById("next");if(nx)nx.onclick=()=>{S.qi++;render()};
 const sb=document.getElementById("sub");if(sb)sb.onclick=submit;
}
function submit(){
 const correct=S.qs.reduce((n,q,i)=>n+(S.ans[i]===q.a?1:0),0);
 const pct=Math.round(correct/QCOUNT*100),pass=correct/QCOUNT>=PASS,date=today();
 S.result={correct,pct,pass,date,code:pass?makeCode(S.name,S.id,pct,date):null};
 S.step="result";render();
}

function renderResult(){
 const R=S.result;
 if(R.pass){
  app.innerHTML=`<section class="panel">
   <svg class="passmark" viewBox="0 0 52 52" aria-hidden="true"><circle class="ac" cx="26" cy="26" r="25" style="fill:var(--accent)"/><path d="M15 27 l7 7 l15 -15"/></svg>
   <span class="pill pass">Réussi</span>
   <div class="row" style="gap:16px;align-items:baseline"><span class="score">${R.pct}%</span><span class="muted">${R.correct} bonnes réponses sur ${QCOUNT}</span></div>
   <h2>Attestation de réussite</h2>
   <dl class="record">
    <dt>Nom</dt><dd>${esc(S.name)}</dd>
    <dt>Matricule</dt><dd>${esc(S.id)}</dd>
    ${S.company?`<dt>Entreprise</dt><dd>${esc(S.company)}</dd>`:""}
    <dt>Formation</dt><dd>Sensibilisation aux premiers secours</dd>
    <dt>Note</dt><dd>${R.pct}% (${R.correct}/${QCOUNT})</dd>
    <dt>Date</dt><dd>${R.date}</dd>
    <dt>Code de vérification</dt><dd class="code">${R.code}</dd>
   </dl>
   <div class="key">Faites une capture d'écran de cette attestation et envoyez-la à votre formateur pour recevoir votre certificat.</div>
   <div class="row"><button id="copy">Copier l'attestation en texte</button><span id="cpmsg" class="muted"></span></div>
  </section>`;
  const txt=`Formation premiers secours réussie\nNom : ${S.name}\nMatricule : ${S.id}\n${S.company?"Entreprise : "+S.company+"\n":""}Note : ${R.pct}% (${R.correct}/${QCOUNT})\nDate : ${R.date}\nCode de vérification : ${R.code}`;
  document.getElementById("copy").onclick=()=>{const m=document.getElementById("cpmsg");
   navigator.clipboard.writeText(txt).then(()=>m.textContent="Copié. Collez-le dans WhatsApp ou un e-mail.").catch(()=>m.textContent="La copie n'est pas disponible ici. Faites une capture d'écran.")};
 }else{
  const wrong=S.qs.map((q,i)=>({q,i})).filter(x=>S.ans[x.i]!==x.q.a);
  app.innerHTML=`<section class="panel">
   <span class="pill fail">Non réussi</span>
   <div class="row" style="gap:16px;align-items:baseline"><span class="score">${R.pct}%</span><span class="muted">${R.correct} bonnes réponses sur ${QCOUNT}. Il en faut ${Math.ceil(PASS*QCOUNT)}.</span></div>
   <p>Revoyez les questions ci-dessous, relisez les leçons, puis réessayez. La nouvelle tentative utilise d'autres questions.</p>
   <div class="review">${wrong.map(x=>`<div><p>${x.q.q}</p><p class="muted"><span class="no">Votre réponse :</span> ${x.q.o[S.ans[x.i]]}<br><span class="ok">Bonne réponse :</span> ${x.q.o[x.q.a]}</p></div>`).join("")}</div>
   <div class="row end"><button id="rev">Revoir les leçons</button><button class="primary" id="retry">Refaire l'évaluation</button></div>
  </section>`;
  document.getElementById("rev").onclick=()=>{S.step="lesson";S.lesson=0;render()};
  document.getElementById("retry").onclick=startQuiz;
 }
}

function renderVerify(){
 app.innerHTML=`<section class="panel">
  <span class="eyebrow">Réservé au formateur</span>
  <h2>Vérifier un code de réussite</h2>
  <p class="muted">Saisissez les informations exactement comme sur l'attestation du stagiaire. Les codes des versions arabe et anglaise sont aussi acceptés.</p>
  <form id="vf" style="display:flex;flex-direction:column;gap:14px">
   <label for="vn">Nom complet<input id="vn" type="text" required></label>
   <label for="vi">Matricule<input id="vi" type="text" required></label>
   <label for="vs">Note en % (chiffre uniquement)<input id="vs" type="text" inputmode="numeric" required></label>
   <label for="vd">Date (AAAA-MM-JJ)<input id="vd" type="text" placeholder="2026-10-21" required></label>
   <label for="vc">Code de vérification<input id="vc" type="text" placeholder="XXXX-XXXX" required></label>
   <div class="row end"><button type="button" id="back">Retour à la formation</button><button class="primary" type="submit">Vérifier le code</button></div>
  </form>
  <div id="vr" aria-live="polite"></div></section>`;
 document.getElementById("back").onclick=()=>{history.replaceState(null,"",location.pathname+location.search);render()};
 document.getElementById("vf").addEventListener("submit",e=>{e.preventDefault();
  const g=id=>document.getElementById(id).value.trim();
  const sc=parseInt(g("vs"),10),exp=makeCode(g("vn"),g("vi"),sc,g("vd")),got=g("vc").toUpperCase().replace(/\s/g,"");
  const ok=exp===got&&sc>=PASS*100,vr=document.getElementById("vr");
  vr.innerHTML=ok?`<div class="key"><span class="ok">Valide.</span> Cette attestation a bien été générée par la formation pour ce stagiaire. Vous pouvez délivrer le certificat.</div>`
   :`<div class="caution"><b>Ne correspond pas.</b> Vérifiez l'orthographe du nom et du matricule, la note et la date. S'ils sont corrects, l'attestation a peut-être été modifiée.</div>`;
 });
}

window.addEventListener("hashchange",render);
render();
</script>

</body></html>
